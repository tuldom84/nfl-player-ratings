name: Patch pending prediction refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply sync-data.mjs patch
        run: python3 scripts/refresh_pending_predictions.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-data.mjs
          git rm -f scripts/refresh_pending_predictions.py .github/workflows/patch-pending-predictions.yml || true
          git commit -m "Sync: refresh pending betting predictions when projections change" || echo "nothing to commit"
          git push origin HEAD:main || true
