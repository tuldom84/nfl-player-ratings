name: Patch conversion friction

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch BettingGameDetail UI
        run: python3 scripts/apply_friction_ui.py

      - name: Commit UI and remove temp workflow/scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/BettingGameDetail.tsx
          git rm -f .github/workflows/patch-conversion-friction.yml \
            scripts/apply_conversion_friction.py \
            scripts/apply_friction_ui.py || true
          git commit -m "Betting UI: show conversion friction; remove temp patch workflow" || true
          git push origin HEAD:main || true
